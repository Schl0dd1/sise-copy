[build]
  command = "hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.154.5"
# Weiterleitungen von alten Adressen (Umbau der Seitenstruktur, Nov. 2026)
[[redirects]]
  from = "/wer-wir-sind/"
  to = "/ueber-uns/"
  status = 301

[[redirects]]
  from = "/podcasts/*"
  to = "/was-wir-machen/podcast/:splat"
  status = 301

[[redirects]]
  from = "/workshops/"
  to = "/was-wir-machen/workshops/"
  status = 301

[[redirects]]
  from = "/vortraege/"
  to = "/was-wir-machen/vortraege/"
  status = 301

[[redirects]]
  from = "/materialien/"
  to = "/was-wir-machen/materialien/"
  status = 301

[[redirects]]
  from = "/gallery/*"
  to = "/beitraege/galerie/:splat"
  status = 301

[[redirects]]
  from = "/termine/*"
  to = "/veranstaltungen/:splat"
  status = 301

[[redirects]]
  from = "/posts/*"
  to = "/"
  status = 301
