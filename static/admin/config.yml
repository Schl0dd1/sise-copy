backend:
  name: git-gateway
  branch: main

local_backend: true

slug:
  encoding: "ascii"
  clean_accents: true

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    format: frontmatter
    files:
      - label: "Wer wir sind (Homepage)"
        name: "homepage"
        file: "content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Workshops"
        name: "workshops"
        file: "content/projects/workshops.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Vorträge"
        name: "vortraege"
        file: "content/projects/vortraege.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "seiten"
    label: "Seiten"
    label_singular: "Seite"
    description: "Eigene Seiten, z. B. Kontakt oder Links. Jede Seite ist unter /<url-name>/ erreichbar."
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Titel",
          name: "title",
          widget: "string",
          hint: "Beim ersten Speichern wird daraus die Adresse der Seite (z. B. „Über uns“ → /uber-uns/). Sie bleibt danach gleich, auch wenn der Titel geändert wird.",
        }
      - { label: "Datum", name: "date", widget: "datetime" }
      - label: "Im Menü anzeigen"
        name: "menu_bereich"
        widget: "select"
        default: "keins"
        options:
          - { label: "Nicht im Menü", value: "keins" }
          - { label: "Im Hauptmenü", value: "hauptmenue" }
          - { label: "Unter „Was wir machen“", value: "was-wir-machen" }
      - label: "Menütext"
        name: "menu_name"
        widget: "string"
        required: false
        hint: "Optional, falls im Menü ein kürzerer Text als der Titel stehen soll."
      - label: "Position im Menü"
        name: "menu_position"
        widget: "number"
        value_type: "int"
        required: false
        hint: >-
          Kleinere Zahl = weiter vorne. Leer = ganz am Ende.
          Hauptmenü: Wer wir sind 10 · Aktuelles 20 · Was wir machen 30 · Links 40 · Galerie 50 · Kontakt 60
          (z. B. 55 = zwischen Galerie und Kontakt).
          Unter „Was wir machen“: Podcasts 10 · Workshops 20 · Vorträge 30.
      - { label: "Text", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "podcasts"
    label: "Podcasts"
    folder: "content/podcasts"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Audio File", name: "audio", widget: "file" }
      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          required: false,
        }
      - {
          label: "Duration",
          name: "duration",
          widget: "string",
          required: false,
        }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "gallery"
    label: "Galerie"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Bilder"
        name: "photos"
        widget: "list"
        fields:
          - { label: "Bild", name: "image", widget: "image" }
          - {
              label: "Bildbeschreibung",
              name: "alt",
              widget: "string",
              required: false,
              hint: "Beschreibung für Screenreader / blinde Nutzer*innen",
            }
      - {
          label: "Album Beschreibung",
          name: "body",
          widget: "markdown",
          required: false,
        }
