backend:
  name: git-gateway
  branch: main

local_backend: true

slug:
  encoding: "ascii"
  clean_accents: true

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Statische Seiten"
    format: frontmatter
    files:
      - label: "Über uns"
        name: "ueber-uns"
        file: "content/pages/wer-wir-sind.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - label: "Workshops"
        name: "workshops"
        file: "content/projects/workshops.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - label: "Podcast"
        name: "podcast"
        file: "content/podcasts/_index.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - {
              label: "Einleitungstext",
              name: "body",
              widget: "markdown",
              required: false,
              hint: "Steht auf /podcasts/ über der Liste der Folgen. Folgen selbst werden unter „Podcasts“ angelegt.",
            }
      - label: "Materialien"
        name: "materialien"
        file: "content/pages/materialien.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }
      - label: "Kontakt"
        name: "kontakt"
        file: "content/pages/kontakt.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Text", name: "body", widget: "markdown" }

  - name: "seiten"
    label: "Weitere Seiten"
    label_singular: "Seite"
    description: "Eigene Seiten, z. B. Links oder Vorträge. Jede Seite ist unter /<url-name>/ erreichbar."
    folder: "content/pages"
    # Nur Seiten mit typ: weitere – die statischen Seiten liegen im selben Ordner
    filter: { field: "typ", value: "weitere" }
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Typ", name: "typ", widget: "hidden", default: "weitere" }
      - {
          label: "Titel",
          name: "title",
          widget: "string",
          hint: "Beim ersten Speichern wird daraus die Adresse der Seite (z. B. „Über uns“ → /uber-uns/). Sie bleibt danach gleich, auch wenn der Titel geändert wird.",
        }
      - { label: "Datum", name: "date", widget: "datetime" }
      - label: "Im Menü anzeigen"
        name: "menu_bereich"
        widget: "select"
        default: "keins"
        options:
          - { label: "Nicht im Menü", value: "keins" }
          - { label: "Im Hauptmenü", value: "hauptmenue" }
          - { label: "Unter „Was wir machen“", value: "was-wir-machen" }
      - label: "Menütext"
        name: "menu_name"
        widget: "string"
        required: false
        hint: "Optional, falls im Menü ein kürzerer Text als der Titel stehen soll."
      - label: "Position im Menü"
        name: "menu_position"
        widget: "number"
        value_type: "int"
        required: false
        hint: >-
          Kleinere Zahl = weiter vorne. Leer = ganz am Ende.
          Hauptmenü: Startseite 10 · Aktuelles 20 · Was wir machen 30 · Materialien 35 · Links 40 · Galerie 50 · Kontakt 60
          (z. B. 55 = zwischen Galerie und Kontakt).
          Unter „Was wir machen“: Podcasts 10 · Workshops 20 · Vorträge 30.
      - { label: "Text", name: "body", widget: "markdown" }

  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "podcasts"
    label: "Podcasts"
    label_singular: "Folge"
    description: "Jede Folge bekommt eine eigene Seite. Titel, Bild, Player und Teaser erscheinen automatisch auf der Übersicht /podcasts/."
    folder: "content/podcasts"
    create: true
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - {
          label: "Datum",
          name: "date",
          widget: "datetime",
          hint: "Neueste Folgen stehen in der Übersicht oben.",
        }
      - {
          label: "Vorschaubild",
          name: "cover",
          widget: "image",
          required: false,
          hint: "Wird links neben der Folge angezeigt, am besten quadratisch.",
        }
      - {
          label: "Audiodatei",
          name: "audio",
          widget: "file",
          hint: "MP3-Datei oder Link zu einer Audiodatei. Wird als Player in der Übersicht und auf der Folgenseite angezeigt.",
        }
      - {
          label: "Dauer",
          name: "duration",
          widget: "string",
          required: false,
          hint: "z. B. 32:10",
        }
      - {
          label: "Teaser",
          name: "teaser",
          widget: "text",
          hint: "Kurzer Beschreibungstext (1–3 Sätze) für die Übersicht. Steht auch oben auf der Folgenseite.",
        }
      - {
          label: "Ausführlicher Text",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Erscheint nur auf der Folgenseite, z. B. Shownotes, Gäst*innen, Links.",
        }

  - name: "gallery"
    label: "Galerie"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Bilder"
        name: "photos"
        widget: "list"
        fields:
          - { label: "Bild", name: "image", widget: "image" }
          - {
              label: "Bildbeschreibung",
              name: "alt",
              widget: "string",
              required: false,
              hint: "Beschreibung für Screenreader / blinde Nutzer*innen",
            }
      - {
          label: "Album Beschreibung",
          name: "body",
          widget: "markdown",
          required: false,
        }
