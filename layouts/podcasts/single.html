{{ define "main" }}
<article class="page-shell">
  <header class="page-header">
    <p class="page-meta"><a class="page-list-link" href="{{ .Parent.RelPermalink }}">&larr; Alle Folgen</a></p>
    <h1 class="heading-1">{{ .Title }}</h1>
    {{- with .Params.duration }}
    <p class="page-meta">Dauer: {{ . }}</p>
    {{- end }}
  </header>

  <div class="podcast-episode-intro">
    {{- with .Params.cover }}
    <img class="podcast-episode-image" src="{{ . }}" alt="">
    {{- end }}

    <div>
      {{- with .Params.teaser }}
      <p class="podcast-episode-teaser">{{ . }}</p>
      {{- end }}

      {{- with .Params.audio }}
      <audio class="audio-player" controls preload="metadata" src="{{ . }}">
        <a href="{{ . }}">Folge herunterladen</a>
      </audio>
      {{- end }}
    </div>
  </div>

  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
