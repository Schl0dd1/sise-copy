{{ define "main" }}
<div class="px-4 pt-8 pb-4 sm:px-8 lg:px-16 lg:pt-12">
  <article class="mx-auto max-w-[880px]">
    <header class="mb-10 flex flex-col gap-6">
      <a href="{{ .Parent.RelPermalink }}" class="self-start rounded-full bg-lilac px-4 py-2 text-small font-bold text-plum no-underline hover:bg-mint focus-visible:bg-mint"><span aria-hidden="true">←</span> Alle Folgen</a>
      <h1 class="m-0 font-slab text-h2 font-light tracking-[-0.02em] text-balance text-plum sm:text-h1 sm:leading-[1.05]">{{ .Title }}</h1>
      {{- with .Params.duration }}
      <p class="m-0 eyebrow">Dauer: {{ . }}</p>
      {{- end }}
    </header>

    <div class="mb-12 grid items-start gap-8 rounded-card bg-white p-6 sm:p-8 {{ if .Params.cover }}sm:grid-cols-[220px_minmax(0,1fr)]{{ end }}">
      {{- with .Params.cover }}
      <img class="aspect-square w-full max-w-[280px] rounded-media object-cover" src="{{ . | relURL }}" alt="">
      {{- end }}
      <div class="flex flex-col gap-4">
        {{- with .Params.teaser }}
        <p class="m-0 font-slab text-h4 text-plum">{{ . }}</p>
        {{- end }}
        {{- with .Params.audio }}
        <audio class="w-full" controls preload="metadata" src="{{ . }}">
          <a href="{{ . }}">Folge herunterladen</a>
        </audio>
        {{- end }}
      </div>
    </div>

    <div class="prose-sise prose max-w-none">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
