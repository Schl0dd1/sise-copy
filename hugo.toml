baseURL = "https://sichtbarundselbstbestimmt.org/"
locale = "de"
defaultContentLanguage = "de"
title = "Sichtbar & Selbstbestimmt"
theme = "ananke"

[permalinks]
  pages = "/:contentbasename/"
  projects = "/:slug/"
  podcasts = "/podcasts/:slug/"

[params]
  description = "Kollektive Auseinandersetzung mit sexualisierter Gewalt"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  mainSections = ["posts"]

[menu]
  # Gewichte in Zehnerschritten, damit im CMS angelegte Seiten
  # (Feld "Position im Menü") dazwischen einsortiert werden können.

  [[menu.main]]
    name = "Wer wir sind"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Aktuelles"
    url = "/posts/"
    weight = 20

  [[menu.main]]
    name = "Was wir machen"
    identifier = "was-wir-machen"
    weight = 30
    [menu.main.params]
      hasChildren = true

  [[menu.main]]
    name = "Podcasts"
    url = "/podcasts/"
    parent = "was-wir-machen"
    weight = 10

  [[menu.main]]
    name = "Workshops"
    url = "/workshops/"
    parent = "was-wir-machen"
    weight = 20

  [[menu.main]]
    name = "Vorträge"
    url = "/vortraege/"
    parent = "was-wir-machen"
    weight = 30

  [[menu.main]]
    name = "Links"
    url = "/links/"
    weight = 40

  [[menu.main]]
    name = "Galerie"
    url = "/gallery/"
    weight = 50

  [[menu.main]]
    name = "Kontakt"
    url = "/kontakt/"
    weight = 60

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'