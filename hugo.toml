baseURL = "https://sichtbarundselbstbestimmt.org/"
locale = "de"
timeZone = "Europe/Berlin"
defaultContentLanguage = "de"
title = "Sichtbar & Selbstbestimmt"
theme = "ananke"

# Keine Tags/Kategorien
disableKinds = ["taxonomy", "term"]

[permalinks]
  # Kontakt, Impressum, Datenschutz, „Weitere Seiten“ direkt unter /<dateiname>/
  pages = "/:contentbasename/"

[params]
  description = "Kollektive Auseinandersetzung mit sexualisierter Gewalt"

[menu]
  # Hauptmenü: ein Eintrag pro Bereich. „identifier“ = Ordnername in content/.
  # Die Unterseiten (Dropdown) kommen automatisch aus dem jeweiligen Ordner,
  # siehe layouts/_partials/main-menu.html.
  # Gewichte in Zehnerschritten, damit „Weitere Seiten“ (Feld „Position im Menü“)
  # dazwischen einsortiert werden können.

  [[menu.main]]
    name = "Über uns"
    identifier = "ueber-uns"
    url = "/ueber-uns/"
    weight = 10

  [[menu.main]]
    name = "Veranstaltungen"
    identifier = "veranstaltungen"
    url = "/veranstaltungen/"
    weight = 20

  [[menu.main]]
    name = "Was wir machen"
    identifier = "was-wir-machen"
    url = "/was-wir-machen/"
    weight = 30

  [[menu.main]]
    name = "Beiträge & kreative Aktionen"
    identifier = "beitraege"
    url = "/beitraege/"
    weight = 40

  [[menu.main]]
    name = "Links"
    identifier = "links"
    url = "/links/"
    weight = 50

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'